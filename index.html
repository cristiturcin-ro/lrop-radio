<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LROP Tower/Approach Radio</title>
<script>
/* telefoane în portret → versiunea portabilă (index.html?desktop forțează desktop) */
try{
  if(!/[?&]desktop/.test(location.search) && matchMedia('(max-width: 700px) and (orientation: portrait) and (pointer: coarse)').matches)
    location.replace('mobile.html');
}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Design B2: front negru, un singur accent – chihlimbar (afișaj VFD, LED-uri, ac, cifre) */
:root{
  --vfd:#ffb347;                 /* afișajul VFD */
  --amber:#ff9a1f;               /* LED-uri, zona roșie a S-metrului */
  --num:#e8a24a;                 /* cifrele tipărite deasupra tastelor MEMORY */
  --ink:#ececec; --sub:#c9c9c9;  /* serigrafia albă de pe panou */
  --tab:#2a2b2f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(ellipse at 50% 30%,#26282b 0%,#111214 70%);
  display:flex;align-items:center;justify-content:center;
  font-family:"Barlow Condensed",Arial Narrow,sans-serif;color:var(--ink);
  overflow-x:hidden;user-select:none;-webkit-user-select:none;
  min-height:100vh;padding:16px;
}
#fit{position:relative}
#stage{position:absolute;left:0;top:0;width:1040px;height:450px;transform-origin:0 0}
.abs{position:absolute}

/* ---------- carcasa ---------- */
.case{position:absolute;left:0;top:0;width:1040px;height:400px;border-radius:8px;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,rgba(0,0,0,0) 1px 3px),
             linear-gradient(180deg,#202124 0%,#161719 55%,#0e0f10 100%);
  box-shadow:0 2px 0 #34363a inset,0 -2px 0 #050506 inset,0 25px 40px rgba(0,0,0,.65),0 0 0 2px #08090a}
.foot{position:absolute;top:396px;width:70px;height:24px;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#141416,#050506)}
.lbl{position:absolute;font:600 11px/1 "Barlow Condensed";letter-spacing:1.5px;color:var(--ink);white-space:nowrap}
.tab{position:absolute;height:16px;background:var(--tab);border-radius:2px;font:700 10px/16px "Barlow Condensed";
  letter-spacing:2px;color:var(--ink);text-align:center;cursor:help}
.badge{display:flex;align-items:center;gap:8px}
.badge .brand{padding:2px 6px;border:1px solid var(--ink);border-radius:2px;font:700 12px/1 "Barlow Condensed";letter-spacing:2px}
.badge .model{font:700 16px/1 "Barlow Condensed";letter-spacing:1px}
.subtitle{left:24px;top:100px;width:140px;font:600 9px/1.35 "Barlow Condensed";letter-spacing:2px;color:var(--sub);white-space:normal}

/* ---------- taste ---------- */
button{font-family:inherit}
.btn{position:absolute;border:none;border-radius:4px;cursor:pointer;padding:0;color:#e8e8e8;white-space:nowrap;
  background:linear-gradient(180deg,#2a2b2f,#141517);
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 -2px 0 rgba(0,0,0,.5) inset,0 2px 3px rgba(0,0,0,.7),0 0 0 1px #0a0a0b;
  font:600 12px/1 "Barlow Condensed";letter-spacing:1px;transition:transform .05s,filter .1s}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 0 2px rgba(0,0,0,.8),0 0 0 1px #0a0a0b}
.btn:focus-visible,.toggle:focus-visible,.knob:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.amber{background:linear-gradient(180deg,#ffb04a,#d9781a);color:#1c1006}
.btn.lit,.btn.on{color:var(--vfd);text-shadow:0 0 6px rgba(255,150,40,.45)}
.btn .led{position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:#2a1a0a;transition:.15s}
.btn.on .led{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.btn.power.idle{animation:pwrGlow 1.8s ease-in-out infinite}
@keyframes pwrGlow{50%{box-shadow:0 0 0 2px var(--amber),0 0 16px 4px rgba(255,140,30,.45)}}
.bandkey{font-size:9.5px;letter-spacing:.3px}
.memkey{font-size:11px;letter-spacing:.6px}
.mnum{font:700 10px/1 "Barlow Condensed";letter-spacing:0;color:var(--num)}

/* comutatoare cu levier (MUTE, LOCK) */
.toggle{position:absolute;width:50px;height:92px;border:none;background:none;padding:0;cursor:pointer;color:var(--ink)}
.toggle span{position:absolute;left:0;width:50px;text-align:center;font:600 10px/1 "Barlow Condensed";letter-spacing:1.5px}
.toggle .ton,.toggle .toff{font-size:8px;letter-spacing:1px;color:var(--sub)}
.toggle .ton{top:16px} .toggle .toff{top:80px}
.toggle .slot{left:18px;top:28px;width:14px;height:48px;border-radius:3px;background:#050506;
  box-shadow:0 1px 0 #2a2b2f,0 1px 3px rgba(0,0,0,.8) inset}
.toggle .lever{left:1px;top:28px;width:12px;height:14px;border-radius:2px;transition:top .12s;
  background:linear-gradient(180deg,#3d3f44,#16171a);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 1px 2px rgba(0,0,0,.8),0 0 0 1px #000}
.toggle.on .lever{top:6px}
.toggle.on .ton{color:var(--vfd)}

/* ---------- afișajul VFD ---------- */
.window{left:176px;top:14px;width:650px;height:124px;border-radius:4px;background:#040506;overflow:hidden;
  box-shadow:0 0 0 2px #1b1c1e,0 0 0 4px #3a3c40,0 8px 16px rgba(0,0,0,.7) inset;transition:filter .2s;color:var(--vfd)}
.window > *{transition:opacity .3s}
.window:not(.on) > *:not(.meter):not(.meter-lbl){opacity:0!important}
.window:not(.on) .meter{opacity:.35}
.meter{position:absolute;left:10px;top:10px;width:160px;height:84px;border-radius:3px;
  background:radial-gradient(ellipse at 50% 30%,#1d1f21,#0b0c0d 80%);box-shadow:0 0 0 1px #2a2c2f;cursor:help}
.meter svg{display:block}
.meter text{font-family:"Barlow Condensed",Arial Narrow,sans-serif}
.meter-lbl{position:absolute;left:10px;top:100px;width:160px;text-align:center;font:600 8px/1 "Barlow Condensed";letter-spacing:2px;color:#9a9ca1}
.ann{position:absolute;font:600 10px/1 "Barlow Condensed";letter-spacing:1px;opacity:.14;transition:opacity .15s;cursor:help}
.ann.on{opacity:1;text-shadow:0 0 4px var(--vfd)}
.anns{position:absolute;left:188px;top:106px;display:flex;gap:14px}
.anns .ann{position:static;font-size:9px}
.freq{position:absolute;left:186px;top:28px;display:flex;align-items:flex-end;gap:4px;filter:drop-shadow(0 0 3px var(--vfd));cursor:help}
.freq svg,.clk svg{display:block;transform:skewX(-7deg)}
.mhz{font:600 11px/1 "Barlow Condensed";margin-left:2px;margin-bottom:2px}
.seg{fill:var(--vfd);fill-opacity:.07}
.seg.on{fill-opacity:1}
.blink{animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.name{position:absolute;right:12px;top:8px;max-width:300px;overflow:hidden;text-overflow:ellipsis;
  font:20px/1 "VT323",monospace;letter-spacing:1px;text-align:right;white-space:pre;text-shadow:0 0 4px var(--vfd);cursor:help}
.clk{position:absolute;right:12px;top:34px;display:flex;align-items:flex-end;gap:5px;filter:drop-shadow(0 0 2px var(--vfd))}
.clk .clab{font:600 10px/1 "Barlow Condensed";letter-spacing:1px;margin-right:2px}
.clk .colon{font:700 18px/20px "Barlow Condensed"}
.clk .off{opacity:.12}
.lcl{position:absolute;right:12px;top:66px;font:16px/1 "VT323",monospace;text-align:right;white-space:pre;text-shadow:0 0 3px var(--vfd)}
.scope{position:absolute;left:188px;top:84px;width:316px;height:16px;cursor:crosshair}
.sdr-open{position:absolute;right:10px;bottom:6px;display:none;border:none;border-radius:2px;cursor:pointer;padding:3px 6px;
  background:var(--vfd);color:#1c1006;font:700 11px/1 "Barlow Condensed";letter-spacing:1px}
.sdr-open.show{display:block}

/* ---------- butoane rotative ---------- */
.ticks i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--ink);margin:-2px 0 0 -2px}
.knum{position:absolute;width:16px;margin:-5px 0 0 -8px;text-align:center;font:600 9px/1 "Barlow Condensed";color:var(--ink)}
.knob{position:absolute;border-radius:50%;cursor:ns-resize;touch-action:none;
  background:repeating-conic-gradient(#2c2d31 0 4deg,#141517 4deg 8deg);box-shadow:0 4px 8px rgba(0,0,0,.8),0 0 0 2px #0a0a0b}
.knob .cap{position:absolute;inset:17%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#45474c,#18191c 70%);
  box-shadow:0 3px 6px rgba(0,0,0,.8),0 0 0 2px #0a0a0b}
.knob .mark{position:absolute;left:50%;top:4px;width:3px;height:32%;margin-left:-1.5px;background:#ddd;border-radius:2px}
.knob > .mark{top:2px;height:9px;background:var(--amber)}

/* dialul mare, negru, direct pe panou */
.dial{left:374px;top:171px;width:186px;height:186px;border-radius:50%;cursor:grab;touch-action:none;
  background:repeating-conic-gradient(#232428 0 3deg,#0d0e10 3deg 6deg);
  box-shadow:0 8px 18px rgba(0,0,0,.85),0 0 0 3px #08080a,0 0 0 5px #2a2b2f}
.dial:active{cursor:grabbing}
.dial-face{position:absolute;inset:17px;border-radius:50%;
  background:radial-gradient(circle at 42% 35%,#2e3034,#0f1012 75%);box-shadow:0 0 0 2px rgba(0,0,0,.6),0 -2px 4px rgba(255,255,255,.06) inset}
.dimple{position:absolute;left:50%;top:22px;width:45px;height:45px;margin-left:-22.5px;border-radius:50%;
  background:radial-gradient(circle at 55% 60%,#2b2d31,#060607 70%);box-shadow:0 1px 1px rgba(255,255,255,.1)}

.hint{position:absolute;left:0;top:430px;width:1040px;text-align:center;font:500 13px/1.4 "Barlow Condensed";color:#8a8c91;letter-spacing:.5px}
.hint b{color:var(--amber);font-weight:700}
#stream{display:none}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div class="foot" style="left:70px"></div><div class="foot" style="left:900px"></div>
  <div class="case"></div>

  <!-- stânga sus: pornire și marca -->
  <button class="btn power" id="power" style="left:24px;top:22px;width:92px;height:30px">POWER<span class="led"></span></button>
  <div class="lbl" style="left:122px;top:22px;font-size:9px;letter-spacing:1px">▬ ON</div>
  <div class="lbl" style="left:122px;top:40px;font-size:9px;letter-spacing:1px">▬ OFF</div>
  <div class="abs badge" style="left:24px;top:78px"><span class="brand" id="brand"></span><span class="model" id="model"></span></div>
  <div class="lbl subtitle" id="subtitle"></div>

  <!-- afișajul: S-metru analogic + VFD -->
  <div class="abs window" id="lcd">
    <div class="meter" id="meter"></div>
    <div class="meter-lbl">S-METER</div>
    <span class="ann on" id="a-am" style="left:188px;top:10px">AM</span>
    <span class="ann" id="a-live" style="left:212px;top:10px">LIVE</span>
    <div class="freq" id="freq"></div>
    <div class="name" id="name"></div>
    <div class="clk" id="clk"></div>
    <div class="lcl" id="lcl"></div>
    <canvas class="scope" id="scope"></canvas>
    <div class="anns">
      <span class="ann" id="a-rx">RX</span><span class="ann" id="a-mute">MUTE</span><span class="ann" id="a-lock">LOCK</span>
      <span class="ann on" id="a-step">STEP 25k</span><span class="ann on" id="a-span">SPAN ±1.25M</span><span class="ann" id="a-clock">CLOCK</span>
    </div>
    <button class="sdr-open" id="sdrOpen">▶ WEB SDR</button>
  </div>

  <!-- dreapta sus: squelch -->
  <div class="lbl" style="left:880px;top:14px;width:100px;text-align:center;letter-spacing:2px">SQUELCH</div>

  <!-- jos stânga: domenii și memorii -->
  <div class="tab" id="bandTab" style="left:24px;top:150px;width:302px">BAND</div>
  <div class="tab" id="memTab" style="left:24px;top:214px;width:302px">MEMORY</div>
  <div id="keys"></div>

  <!-- mijloc: dialul -->
  <div class="dial abs" id="dial"><div class="dial-face" id="dialFace"><div class="dimple"></div></div></div>

  <!-- funcții + comutatoare -->
  <div class="tab" style="left:606px;top:150px;width:140px">FUNCTION</div>
  <div id="fns"></div>
  <button class="toggle" id="tMute" style="left:611px;top:300px" aria-label="MUTE"><span style="top:0">MUTE</span><span class="ton">ON</span><span class="slot"><span class="lever"></span></span><span class="toff">OFF</span></button>
  <button class="toggle" id="tLock" style="left:685px;top:300px" aria-label="LOCK"><span style="top:0">LOCK</span><span class="ton">ON</span><span class="slot"><span class="lever"></span></span><span class="toff">OFF</span></button>

  <!-- dreapta: volum -->
  <div class="lbl" style="left:880px;top:176px;width:100px;text-align:center;font-size:12px;letter-spacing:2px">VOLUME</div>
  <div id="knobs"></div>

  <div class="hint"><b>①</b> alege un post din MEMORY (radioul pornește singur) &nbsp;<b>②</b> VOLUME și MUTE în dreapta &nbsp;·&nbsp; ține mouse-ul pe orice buton ca să afli ce face &nbsp;·&nbsp; <a href="mobile.html" style="color:#ff9a1f">versiunea portabilă</a></div>
</div></div>

<audio id="stream" preload="none"></audio>

<script src="channels.js"></script>
<script src="sdr.js"></script>
<script src="help.js"></script>
<script src="keepalive.js"></script>
<script src="vu.js"></script>
<script>
(() => {
/* Configurarea (nume, canale, frecvențe) e în channels.js – comună cu versiunea de mobil. */
const CONFIG = window.RADIO_CONFIG;
const CHANNELS = CONFIG.channels;
const STREAM_BASE = CONFIG.streamBase;
const BANDS = CONFIG.bands;
const bandIdx = f => BANDS.findIndex(b => f>=b.lo && f<=b.hi);
const SPANS = [200, 500, 1000, 2500, 5000];   // kHz, lățimea totală a spectrului
const sdr = new SDR.KiwiPlayer();
const isSdr = c => !!(c && c.rx);

const $ = id => document.getElementById(id);
const stage = $('stage'), lcd = $('lcd'), audio = $('stream');
$('brand').textContent = CONFIG.brand;
$('model').textContent = CONFIG.model;
$('subtitle').textContent = CONFIG.subtitle;

/* ---------------- persistence (best effort) ---------------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('lrop.'+k); return v==null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('lrop.'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------------- state ---------------- */
const S = {
  power:false, freq:store.get('freq', CHANNELS[0].f), step:25, mode:'AM',
  af:store.get('af', .6), sql:store.get('sql', .15), dim:store.get('dim', 1), mute:false,
  pamp:false, att:false, nb:false, nr:false, anf:false, agc:'F', fil:2,
  lock:false, entry:null, err:0, span:3,
  clock:store.get('clock', true),       // zona de ceas de pe afișaj (CLOCK)
  info:false,                           // INFO: pe rândul cu numele, sursa și starea conexiunii
  streamState:'OFF', level:0, ch:null
};
// dacă frecvența salvată nu mai e pe niciun canal (ex. un canal scos), pornește pe primul canal
if(bandIdx(S.freq)<0 || !CHANNELS.some(c=>Math.abs(c.f-S.freq)<=6)) S.freq = CHANNELS[0].f;
S.band = bandIdx(S.freq); S.mode = BANDS[S.band].mode; S.step = BANDS[S.band].step;

/* ---------------- 7-segment ---------------- */
const H=(x1,x2,y)=>`${x1},${y} ${x1+5},${y-5} ${x2-5},${y-5} ${x2},${y} ${x2-5},${y+5} ${x1+5},${y+5}`;
const V=(x,y1,y2)=>`${x},${y1} ${x+5},${y1+5} ${x+5},${y2-5} ${x},${y2} ${x-5},${y2-5} ${x-5},${y1+5}`;
const SEGS={a:H(9,51,6),b:V(54,9,48),c:V(54,52,91),d:H(9,51,94),e:V(6,52,91),f:V(6,9,48),g:H(9,51,50)};
const MAP={'0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg',
  '-':'g',' ':'','E':'adefg','r':'eg','o':'cdeg','n':'ceg','P':'abefg','L':'def','A':'abcefg','S':'acdfg','C':'adef','F':'aefg',
  'H':'bcefg','U':'bcdef','d':'bcdeg','b':'cdefg','_':'d','t':'defg','i':'c'};
function digit(ch, h, dp){
  const on = MAP[ch] ?? '';
  const w = h*0.62;
  let s = `<svg width="${w+(dp?h*.12:0)}" height="${h}" viewBox="0 0 ${60+(dp?12:0)} 100">`;
  for(const k in SEGS) s += `<polygon class="seg${on.includes(k)?' on':''}" points="${SEGS[k]}"/>`;
  if(dp) s += `<circle class="seg${dp===2?' on':''}" cx="66" cy="94" r="5"/>`;
  return s + '</svg>';
}
function renderDigits(str, h){
  let out='';
  for(let i=0;i<str.length;i++){
    if(str[i]==='.') continue;
    const dp = str[i+1]==='.' ? 2 : 0;
    out += digit(str[i], h, dp || (h>40 ? 1 : 0));
  }
  return out;
}

/* ---------------- S-metru analogic ---------------- */
const NBARS = 22;                          // scara internă: S1 = 0 … S9 = 12 … +60 dB = 21.3
const MCX = 80, MCY = 134, MR = 100;
const mpt = (a, r) => [MCX + r*Math.sin(a*Math.PI/180), MCY - r*Math.cos(a*Math.PI/180)];
(() => {
  const f = n => n.toFixed(1), WHITE = '#e8e8e8', AMB = 'var(--amber)';
  const [x0,y0]=mpt(-40,MR), [x1,y1]=mpt(6,MR), [x2,y2]=mpt(40,MR);
  let o = '<svg viewBox="0 0 160 84" width="160" height="84" aria-hidden="true">';
  o += `<path d="M${f(x0)},${f(y0)} A${MR},${MR} 0 0 1 ${f(x1)},${f(y1)}" fill="none" stroke="${WHITE}" stroke-width="1.4"/>`;
  o += `<path d="M${f(x1)},${f(y1)} A${MR},${MR} 0 0 1 ${f(x2)},${f(y2)}" fill="none" style="stroke:${AMB}" stroke-width="3"/>`;
  for(let i=0;i<24;i++){
    const a=-40+i*80/23, major=i%3===0, [ax,ay]=mpt(a,MR), [bx,by]=mpt(a,MR+(major?7:4));
    o += `<line x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" style="stroke:${a>6?AMB:WHITE}" stroke-width="${major?1.4:1}"/>`;
  }
  [['1',-38],['3',-27],['5',-16],['7',-5],['9',6],['+20',18],['+40',29],['+60',39]].forEach(([t,a])=>{
    const [x,y]=mpt(a,MR-11);
    o += `<text x="${f(x)}" y="${f(y+3)}" font-size="9" font-weight="700" style="fill:${t[0]==='+'?AMB:WHITE}" text-anchor="middle">${t}</text>`;
  });
  o += `<text x="14" y="30" font-size="11" font-weight="700" fill="${WHITE}">S</text>`;
  o += `<text x="80" y="74" font-size="8" font-weight="600" letter-spacing="2" fill="${WHITE}" text-anchor="middle">SIGNAL</text>`;
  o += `<line id="needle" x1="${MCX}" y1="${MCY}" x2="${MCX}" y2="${MCY-MR-9}" style="stroke:var(--vfd)" stroke-width="1.6" transform="rotate(-42 ${MCX} ${MCY})"/>`;
  $('meter').innerHTML = o + '</svg>';
})();
const needle = $('needle');
// nivel 0..1 → unghiul acului (aceeași scară ca vechiul S-metru cu bare)
function needleAngle(lvl){
  const i = Math.max(0, Math.min(1, lvl)) * NBARS;
  return i <= 12 ? -38 + i*44/12 : 6 + (i-12)*33/9.3;
}

/* ---------------- audio ---------------- */
let ctx=null, noiseGain=null;
function initNoise(){
  if(ctx) return;
  try{
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src = ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1600; bp.Q.value=.6;
    noiseGain = ctx.createGain(); noiseGain.gain.value=0;
    src.connect(bp).connect(noiseGain).connect(ctx.destination); src.start();
  }catch(e){ ctx=null; }
}
let streamToken=0;
/* două playere: `audio` (simplu, merge cu orice server) și `audioX` (citit prin Web Audio → S-metru real,
   doar pentru serverele care permit CORS, vezi vu.js). `cur` = cel care cântă acum. */
const audioX = VU.element();
let cur = audio;
const noCors = new Set();          // canale la care citirea a eșuat → rămân pe playerul simplu
const isReal = () => cur===audioX && !isSdr(S.ch);
// dacă stream-ul citit nu pornește (server fără CORS / altă problemă), reîncearcă imediat pe playerul simplu
function corsFail(tok){
  if(tok!==streamToken || !S.ch || cur!==audioX || S.streamState==='LIVE') return false;
  noCors.add(S.ch); connect(S.ch); return true;
}
audioX.addEventListener('error', () => { corsFail(+audioX.dataset.token); });
const onStream = (el, state) => () => { if(S.ch && el===cur && el.dataset.token==streamToken){ S.streamState=state; update(); } };
[audio, audioX].forEach(el => {
  el.addEventListener('playing', onStream(el, 'LIVE'));
  el.addEventListener('waiting', onStream(el, 'BUFFER'));
  el.addEventListener('error',   onStream(el, 'NO LINK'));
});
// non-stop: repornește singur stream-ul dacă pică / se blochează (vezi keepalive.js)
const keepers = [audio, audioX].map(el => KEEPALIVE.watch(el, { active: () => S.power && !!S.ch && !isSdr(S.ch) && cur===el, reconnect: () => { if(S.ch) connect(S.ch); } }));
const keeper = { reset(){ keepers.forEach(k => k.reset()); } };
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='visible' && S.power && ctx && ctx.state==='suspended') ctx.resume();
});

let connectT=null;
// LiveATC: streamBase + mount; alte surse: url complet (stream direct MP3 / Icecast)
const streamUrl = ch => ch.url ? ch.url : STREAM_BASE + ch.mount + '?t=' + Date.now();
function stopEl(el){
  el.dataset.token = -1;
  if(el.getAttribute('src')){ el.pause(); el.removeAttribute('src'); el.load(); }
}
function connect(ch){
  if(isSdr(ch)){
    sdr.attach(ctx);
    sdr.start(ch, st=>{ if(S.ch===ch){ S.streamState=st; update(); } });
    return;
  }
  streamToken++;
  stopEl(audio); stopEl(audioX);
  const url = streamUrl(ch);
  const real = !noCors.has(ch) && VU.corsOk(url) && VU.attach(audioX, ctx);
  cur = real ? audioX : audio;
  cur.dataset.token = streamToken;
  S.streamState='CONNECT';
  cur.src = url;
  if(real) VU.setVolume(0); else audio.volume = 0;
  const tok = streamToken;
  cur.play().catch(()=>{ if(tok===streamToken && !corsFail(tok)){ S.streamState='NO LINK'; update(); } });
}
function disconnect(){
  clearTimeout(connectT);
  streamToken++;
  stopEl(audio); stopEl(audioX);
  sdr.stop();
  S.streamState='OFF';
}
const chTag = c => isSdr(c) ? (sdr.rx ? 'KIWI '+sdr.rx.name : 'WEB SDR') : c.url ? (c.source||'STREAM').toUpperCase() : c.mount.toUpperCase();
const sdrFallback = () => isSdr(S.ch) && ['WEB ONLY','NO RX','BUSY','DOWN','TIMEOUT','NO LINK','BLOCKED','NO AUDIO'].includes(S.streamState);
$('sdrOpen').addEventListener('click', e=>{
  e.stopPropagation();
  const u = S.ch && SDR.openUrl(S.ch);
  if(u) window.open(u, '_blank', 'noopener');
});
/* ceas: în stânga ora Bucureștiului, în dreapta ora locului ascultat (LCL) + diferența față de București */
const HOME_TZ = CONFIG.homeTz || 'Europe/Bucharest', HOME_TAG = CONFIG.homeTag || 'BUC';
const tzFmt = {};
function tzParts(tz, d){
  const f = tzFmt[tz] || (tzFmt[tz] = new Intl.DateTimeFormat('en-GB', {timeZone:tz, hourCycle:'h23',
    year:'numeric', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'}));
  const p = {}; f.formatToParts(d).forEach(x => p[x.type] = x.value);
  p.off = Math.round((Date.UTC(+p.year, p.month-1, +p.day, +p.hour, +p.minute) - Math.floor(d/60000)*60000) / 60000); // min. față de UTC
  return p;
}
const fmtDiff = m => !m ? '±0h' : (m>0?'+':'-') + Math.floor(Math.abs(m)/60) + (Math.abs(m)%60 ? ':'+pad2(Math.abs(m)%60) : '') + 'h';
function clockText(){
  const d = new Date(), h = tzParts(HOME_TZ, d);
  let t = HOME_TAG+' '+h.hour+':'+h.minute+':'+h.second;
  const tz = S.ch && S.ch.tz;
  if(tz){ try{ const p = tzParts(tz, d); t += '  LCL '+p.hour+':'+p.minute+' '+fmtDiff(p.off - h.off); }catch(e){} }
  return t;
}
const filterW = () =>S.fil===1 ? 9 : S.fil===3 ? 4 : 6;     // kHz: cât de departe „prinzi” semnalul
const nearest = (f=S.freq) => CHANNELS.reduce((b,c)=>Math.abs(c.f-f)<Math.abs(b.f-f)?c:b);
/* alege / schimbă stream-ul în funcție de frecvența acordată (cu mică întârziere când rotești dialul) */
function retune(){
  if(!S.power){ if(S.ch){ S.ch=null; disconnect(); } return; }
  const c = nearest();
  const want = Math.abs(c.f - S.freq) <= filterW() ? c : null;
  if(want === S.ch) return;
  disconnect(); S.ch = want; keeper.reset();
  if(want){ S.streamState='CONNECT'; connectT = setTimeout(()=>connect(want), 350); }
}

/* signal model: 0..1 strength of the tuned live signal */
function signal(){
  if(!S.ch) return 0;
  const df = Math.abs(S.freq - S.ch.f), w = filterW();
  if(df<=2) return 1;
  if(df<=w) return 1 - (df-2)/(w-2)*.75;
  return 0;
}
function levels(){
  const sig = signal();
  const live = S.streamState==='LIVE', real = isReal();
  const want = (S.ch && S.ch.mode) || BANDS[Math.max(0,bandIdx(S.freq))].mode;   // modul corect pentru semnalul acordat
  let sLvl = .04 + (S.pamp?.05:0);
  if(sig>0 && live){
    // receptor web: S-metrul arată nivelul real (dBm) raportat de KiwiSDR
    // stream citit prin Web Audio: S-metrul urmează sunetul real (vorbire ≈ S9, liniște ≈ S1)
    const base = isSdr(S.ch) && sdr.dbm!=null ? SDR.meter(sdr.dbm, 12, 21.3, NBARS)*(.55+.45*sig)
               : real ? VU.level()*(.55+.45*sig) : .45 + .4*sig;
    sLvl = Math.max(sLvl, base + (S.pamp?.08:0) - (S.att?.18:0));
  }
  let open = S.sql < .03 || sLvl > S.sql*.9;
  // cu nivel real, squelch-ul se deschide la fiecare transmisie și mai ține 0,8 s după ea
  if(real && live){ const now = performance.now(); if(open) S.sqlHang = now + 800; else open = now < (S.sqlHang||0); }
  let n = 1 - (live ? sig*.95 : 0);
  if(S.mode!==want) n = Math.max(n,.7);
  if(S.pamp) n*=1.4; if(S.att) n*=.5; if(S.nb) n*=.8; if(S.nr) n*=.55; if(S.anf) n*=.9;
  const af = S.mute ? 0 : S.af*S.af;
  const mf = S.mode===want ? 1 : S.mode==='FM' ? 0 : .35;
  const streamVol = (S.power && open && live && sig>0) ? af*sig*mf : 0;
  const noiseVol = (S.power && open) ? af*n*.22 : 0;
  return {sig, sLvl, open, live, real, streamVol, noiseVol};
}
function applyAudio(){
  const L = levels();
  const v = Math.min(1, Math.max(0, L.streamVol));
  if(cur===audioX) VU.setVolume(isSdr(S.ch) ? 0 : v); else audio.volume = isSdr(S.ch) ? 0 : v;
  sdr.setVolume(isSdr(S.ch) ? v : 0);
  if(noiseGain) noiseGain.gain.setTargetAtTime(L.noiseVol, ctx.currentTime, .03);
  return L;
}

/* ---------------- render ---------------- */
function fmtFreq(k){
  const mhz = Math.floor(k/1000), khz = k%1000;
  return [String(mhz).padStart(3,' ')+'.'+String(khz).padStart(3,'0'), '00'];
}
const pad2 = n => String(n).padStart(2,'0');
function renderClock(){
  const el = $('clk');
  if(!S.clock){
    el.innerHTML = `<span class="clab off">${HOME_TAG}</span>${renderDigits('  ',26)}<span class="colon off">:</span>${renderDigits('  ',26)}`;
    $('lcl').textContent = ''; return;
  }
  const d = new Date(), h = tzParts(HOME_TZ, d);
  el.innerHTML = `<span class="clab">${HOME_TAG}</span>${renderDigits(h.hour,26)}<span class="colon${(+h.second)%2?' off':''}">:</span>${renderDigits(h.minute,26)}`;
  let l = '';
  const tz = S.ch && S.ch.tz;
  if(tz){ try{ const p = tzParts(tz, d); l = 'LCL '+p.hour+':'+p.minute+' '+fmtDiff(p.off - h.off); }catch(e){} }
  $('lcl').textContent = l;
}
function update(){
  // la schimbarea benzii: mod + pas automat
  const bi = bandIdx(S.freq);
  if(bi>=0 && bi!==S.band){ S.band = bi; S.mode = BANDS[bi].mode; S.step = BANDS[bi].step; }
  retune();
  const L = applyAudio();
  lcd.classList.toggle('on', S.power);
  lcd.style.filter = `brightness(${.55+.45*S.dim})`;
  $('power').classList.toggle('on', S.power);
  $('power').classList.toggle('idle', !S.power);      // pulsează până îl pornești
  KEEPALIVE.wake(S.power);                            // cât timp e pornit: ecranul nu se stinge
  $('tMute').classList.toggle('on', S.mute); $('tMute').setAttribute('aria-pressed', S.mute);
  $('tLock').classList.toggle('on', S.lock); $('tLock').setAttribute('aria-pressed', S.lock);
  if(fnEls.INFO) fnEls.INFO.classList.toggle('lit', S.info);
  renderGroups();
  const ann = (id,on) => $(id).classList.toggle('on', !!on);
  $('a-am').textContent = S.mode;
  ann('a-live', L.live && S.ch); ann('a-rx', L.open && L.sig>0 && L.live);
  ann('a-mute', S.mute); ann('a-lock', S.lock); ann('a-clock', S.clock);
  $('a-step').textContent = 'STEP '+S.step+'k';
  const hs = SPANS[S.span]/2;
  $('a-span').textContent = 'SPAN ±' + (hs>=1000 ? (hs/1000)+'M' : hs+'k');

  const fe = $('freq');
  if(S.err){ fe.innerHTML = renderDigits('  Err  ',50); }
  else if(S.entry!==null){
    const e = S.entry;
    const shown = e.includes('.') ? e : (e.length>3 ? e.slice(0,3)+'.'+e.slice(3) : e);
    let [a,b=''] = shown.split('.');
    a = a.padStart(3,' ').slice(-3); b=(b+'___').slice(0,3);
    fe.innerHTML = `<div class="blink" style="display:flex;align-items:flex-end">${renderDigits(a+'.'+b,50)}</div>`;
  } else {
    const [main, sub] = fmtFreq(S.freq);
    fe.innerHTML = renderDigits(main,50) + renderDigits(sub,24) + '<span class="mhz">MHz</span>';
  }

  let t;
  const guard = Math.abs((CONFIG.guard||121500) - S.freq)<=2 ? 'GUARD' : null;
  const fb = S.power && sdrFallback();
  if(S.err) t = 'OUT OF BAND';
  else if(S.entry!==null) t = 'ENTER MHz · ENT';
  else if(S.info) t = S.ch ? (chTag(S.ch)+': '+S.streamState) : 'NO FEED HERE';
  else {
    t = (S.ch && S.ch.name) || guard || 'NO CHANNEL';
    if(S.ch && S.streamState!=='LIVE' && !fb) t += ' ['+S.streamState+']';
  }
  $('name').textContent = t;
  renderClock();
  $('sdrOpen').classList.toggle('show', fb && S.err===0 && S.entry===null);
  S.lastL = L;
}

/* ---------------- spectru (puncte, ca un VFD cu matrice) ---------------- */
const scope = $('scope'), sctx = scope.getContext('2d');
const SW = 316, SH = 16, SCOLS = 105;
function sizeScope(){
  const dpr = Math.min(3, (window.devicePixelRatio||1) * (stage._scale||1));
  scope.width = Math.round(SW*dpr); scope.height = Math.round(SH*dpr);
  sctx.setTransform(dpr,0,0,dpr,0,0);
}
const floor = new Float32Array(SCOLS+1).map(()=>Math.random());
function drawScope(){
  const colW = SW/SCOLS, rows = Math.floor(SH/3);
  sctx.clearRect(0,0,SW,SH);
  if(!S.power) return;
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--vfd').trim() || '#ffb347';
  const span = SPANS[S.span], lo = S.freq - span/2;
  const bw = Math.max(1.5, span/SCOLS*1.2);
  const noise = .06 + (S.pamp?.04:0) - (S.att?.02:0);
  for(let i=0;i<SCOLS;i++){
    floor[i] = floor[i]*.6 + Math.random()*.4;
    const f = lo + (i+.5)*span/SCOLS;
    let a = noise*(.4+floor[i]);
    for(const c of CHANNELS){
      const d = Math.abs(f-c.f);
      if(d < bw*4){
        const tuned = S.ch===c && S.streamState==='LIVE';
        const strength = tuned ? Math.max(.25,S.level) : .45+.12*Math.sin(Date.now()/700+c.f);
        a = Math.max(a, strength*Math.exp(-(d*d)/(2*bw*bw*1.2)) * (S.att?.75:1));
      }
    }
    const lit = Math.round(Math.min(1,a)*rows);
    for(let r=0;r<rows;r++){
      sctx.globalAlpha = r < lit ? 1 : .08;
      sctx.fillStyle = ink; sctx.fillRect(i*colW, SH-3-r*3+1, colW-.8, 2);
    }
  }
  // marcajul central (frecvența acordată)
  sctx.globalAlpha = 1; sctx.fillStyle = ink;
  for(let y=0;y<SH;y+=3) sctx.fillRect(SW/2-.5, y, 1, 1.6);
}
scope.addEventListener('click', e=>{
  if(!S.power || S.lock) return;
  const r = scope.getBoundingClientRect();
  const span = SPANS[S.span];
  let f = S.freq + ((e.clientX - r.left)/r.width - .5)*span;
  const c = nearest(f);
  if(Math.abs(c.f - f) < span/40) f = c.f;           // snap pe semnalul vizibil
  else f = Math.round(f/S.step)*S.step;
  S.freq = clampF(f); save(); update();
});
scope.addEventListener('wheel', e=>{ e.preventDefault(); S.span = Math.max(0,Math.min(SPANS.length-1, S.span + (e.deltaY>0?1:-1))); update(); },{passive:false});

/* ---------------- animation ---------------- */
let last=0;
function tick(ts){
  requestAnimationFrame(tick);
  if(ts-last<60) return; last=ts;
  if(!S.power){ S.level=0; needle.setAttribute('transform', `rotate(-42 ${MCX} ${MCY})`); drawScope(); return; }
  let L = S.lastL || levels();
  if((isSdr(S.ch) || isReal()) && S.streamState==='LIVE'){   // nivel real (receptor web sau sunetul stream-ului) → S-metru + squelch live
    L = S.lastL = applyAudio();
    $('a-rx').classList.toggle('on', L.open && L.sig>0 && L.live);
  }
  let target = L.sLvl;
  if(L.sig>0 && L.live){ if(!L.real) target += (Math.random()-.5)*.14; }   // nivelul real nu mai are nevoie de „tremur” simulat
  else target = Math.random()*target*1.3;
  const k = S.agc==='F'?.55:S.agc==='S'?.15:1;
  S.level += (target-S.level)*k;
  needle.setAttribute('transform', `rotate(${needleAngle(S.level).toFixed(1)} ${MCX} ${MCY})`);
  drawScope();
}
requestAnimationFrame(tick);
setInterval(()=>{ if(S.power && S.clock) renderClock(); },1000);

/* ---------------- actions ---------------- */
function save(){ store.set('freq',S.freq); store.set('af',S.af); store.set('sql',S.sql); store.set('dim',S.dim); }
/* acordul relativ (dial, săgeți) rămâne în banda curentă și face wrap la capete */
function clampF(f){ const b = BANDS[Math.max(0,bandIdx(S.freq))]; if(f<b.lo) return b.hi; if(f>b.hi) return b.lo; return f; }
function tune(steps){
  if(!S.power || S.lock) return;
  const st=S.step, dir=Math.sign(steps);
  for(let k=0;k<Math.abs(steps);k++){
    const from=S.freq;
    let f = dir>0 ? (Math.floor(from/st)+1)*st : (Math.ceil(from/st)-1)*st;
    // dialul se oprește singur pe orice canal aflat între poziția curentă și următorul pas
    const hit = CHANNELS.filter(c => dir>0 ? (c.f>from && c.f<f) : (c.f<from && c.f>f)).sort((a,b)=>dir*(a.f-b.f))[0];
    if(hit) f = hit.f;
    S.freq = clampF(f);
  }
  save(); update();
}
function power(){
  S.power=!S.power;
  if(S.power){ initNoise(); if(ctx && ctx.state==='suspended') ctx.resume(); }
  else S.entry=null;
  update();
}
function toggleMute(){ S.mute=!S.mute; update(); }
function keyIn(ch){
  if(!S.power) return;
  if(S.entry===null) S.entry='';
  if(ch==='.' && S.entry.includes('.')) return;
  if(S.entry.replace('.','').length>=6) return;
  S.entry += ch; update();
}
function enter(){
  if(!S.power || S.entry===null) return;
  const e=S.entry; S.entry=null;
  const mhz = e.includes('.') ? parseFloat(e) : (e.length>3 ? parseFloat(e.slice(0,3)+'.'+e.slice(3)) : parseFloat(e));
  let k = Math.round(mhz*1000);
  // doar cifre și nu e frecvență VHF validă → poate e kHz în HF (ex. 5505)
  if(bandIdx(k)<0 && !e.includes('.') && bandIdx(+e)>=0) k = +e;
  if(!isFinite(k) || bandIdx(k)<0){ S.err=1; update(); setTimeout(()=>{S.err=0;update();},1200); return; }
  S.freq=k; save(); update();
}
function clr(){ S.entry=null; S.err=0; update(); }

  ['INFO',  680,172, 66,'',      ()=>{ S.info=!S.info; update(); }, TIP.INFO],
  ['SPAN',  606,214, 66,'',      ()=>{ S.span=(S.span+1)%SPANS.length; update(); }, TIP.SPAN],
  ['STEP',  680,214, 66,'',      ()=>{ S.step = S.step===25?5:S.step===5?1:25; update(); }, TIP.STEP],
  ['LIGHT', 606,256,140,'',      ()=>{ S.dim = S.dim>.9 ? .7 : S.dim>.6 ? .4 : 1; save(); update(); }, TIP.dim],
].forEach(([n,x,y,w,cls,fn,help])=>{ fnEls[n] = mkBtn(fns,{x,y,w,h:30,cls,label:n,fn,title:n,help}); });

/* BAND (domeniile) și MEMORY (posturile domeniului ales, 3 pe rând, cu numărul tipărit deasupra) */
const keys=$('keys');
const GROUPS = (CONFIG.groups && CONFIG.groups.length) ? CONFIG.groups : [{id:'*', name:'CANALE', info:''}];
const grpOf = c => GROUPS.some(g=>g.id===c.group) ? c.group : GROUPS[0].id;
S.grp = grpOf(nearest()); S.autoGrp = null;
const BX = 24, BW = 302;
const bandEls = GROUPS.length<2 ? [] : GROUPS.map((g,i)=>{
  const w = (BW - (GROUPS.length-1)*8) / GROUPS.length;
  return mkBtn(keys,{x:BX+i*(w+8), y:172, w, h:26, cls:'bandkey', label:`${g.name}<span class="led"></span>`, title:g.name,
    help:{t:g.name, d:g.info || TIP.band.d}, fn:()=>{ S.grp=g.id; renderGroups(); }});
});
if(GROUPS.length<2) $('bandTab').style.display='none';
HELP.attach($('bandTab'), TIP.band);
const memEls = CHANNELS.map(c=>{
  const i = CHANNELS.filter(x=>grpOf(x)===grpOf(c)).indexOf(c);     // cel mult 9 posturi pe domeniu (3 × 3)
  const x = BX + (i%3)*104, y = 236 + Math.floor(i/3)*46;
  const num = document.createElement('div'); num.className='lbl mnum';
  Object.assign(num.style,{left:x+'px', top:y+'px'}); num.textContent = i+1; keys.appendChild(num);
  const b = mkBtn(keys,{x, y:y+13, w:92, h:28, cls:'memkey', label:`${c.btn || c.mount.toUpperCase()}<span class="led"></span>`,
    title:c.name+' '+fmtF(c.f), help:chHelp(c),
    fn:()=>{ if(S.lock) return; if(!S.power) power(); S.freq=c.f; save(); update(); }});
  return {b, num};
});
function renderGroups(){
  // domeniul urmează postul acordat (dar poți răsfoi alt domeniu fără să schimbi frecvența)
  const cg = S.ch ? grpOf(S.ch) : null;
  if(cg && cg!==S.autoGrp){ S.autoGrp = cg; S.grp = cg; }
  const g = GROUPS.find(g=>g.id===S.grp) || GROUPS[0];
  $('memTab').textContent = GROUPS.length<2 ? g.name : 'MEMORY · '+g.name;
  bandEls.forEach((b,i)=>b.classList.toggle('on', GROUPS[i].id===S.grp));
  CHANNELS.forEach((c,i)=>{
    const show = grpOf(c)===S.grp;
    memEls[i].b.style.display = memEls[i].num.style.display = show ? '' : 'none';
    memEls[i].b.classList.toggle('on', S.power && S.ch===c);
  });
}

$('power').addEventListener('click',power);
$('tMute').addEventListener('click',toggleMute);
$('tLock').addEventListener('click',()=>{ S.lock=!S.lock; update(); });
HELP.attach($('power'), TIP.power); HELP.attach($('tMute'), TIP.mute); HELP.attach($('tLock'), TIP.lock);
HELP.attach($('a-mute'), TIP.mute); HELP.attach($('a-lock'), TIP.lock); HELP.attach($('a-clock'), TIP.clock);
HELP.attach($('freq'), TIP.freq); HELP.attach($('meter'), TIP.smeter);
HELP.attach($('scope'), TIP.scope); HELP.attach($('name'), TIP.text); HELP.attach($('sdrOpen'), TIP.sdrOpen);
HELP.attach($('a-live'), TIP.live); HELP.attach($('a-rx'), TIP.rx);

/* butoane rotative negre, cu scară 0–10 tipărită în jur */
function makeKnob({cx,cy,r,get,set,title,help}){
  const host=$('knobs');
  const ticks=document.createElement('div'); ticks.className='ticks';
  for(let i=0;i<11;i++){
    const a=(-135+i*27)*Math.PI/180;
    const d=document.createElement('i'); d.style.left=(cx+Math.sin(a)*(r+9))+'px'; d.style.top=(cy-Math.cos(a)*(r+9))+'px'; ticks.appendChild(d);
    if(i%2===0){
      const n=document.createElement('div'); n.className='knum'; n.textContent=i;
      n.style.left=(cx+Math.sin(a)*(r+20))+'px'; n.style.top=(cy-Math.cos(a)*(r+20))+'px'; ticks.appendChild(n);
    }
  }
  host.appendChild(ticks);
  const k=document.createElement('div'); k.className='knob'; k.setAttribute('aria-label',title);
  k.setAttribute('role','slider'); k.tabIndex=0;
  if(help) HELP.attach(k, help);
  Object.assign(k.style,{left:(cx-r)+'px',top:(cy-r)+'px',width:r*2+'px',height:r*2+'px'});
  k.innerHTML='<div class="mark"></div><div class="cap"><div class="mark"></div></div>';
  const draw=()=>{ k.style.transform=`rotate(${-135+get()*270}deg)`; k.setAttribute('aria-valuenow', Math.round(get()*10)); };
  const setV=v=>{ set(Math.max(0,Math.min(1,v))); draw(); update(); save(); };
  let y0=null,v0=0;
  k.addEventListener('pointerdown',e=>{e.stopPropagation();k.setPointerCapture(e.pointerId);y0=e.clientY;v0=get();});
  k.addEventListener('pointermove',e=>{ if(y0!==null) setV(v0+(y0-e.clientY)/150); });
  k.addEventListener('pointerup',()=>y0=null);
  k.addEventListener('wheel',e=>{e.preventDefault();e.stopPropagation(); setV(get()-Math.sign(e.deltaY)*.04);},{passive:false});
  k.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'||e.key==='ArrowRight') setV(get()+.05);
    else if(e.key==='ArrowDown'||e.key==='ArrowLeft') setV(get()-.05);
    else return;
    e.preventDefault(); e.stopPropagation();
  });
  host.appendChild(k); draw(); return k;
}
makeKnob({cx:930, cy:76, r:28, get:()=>S.sql, set:v=>S.sql=v,                   title:'SQUELCH', help:TIP.sql});
makeKnob({cx:930, cy:262,r:46, get:()=>S.af,  set:v=>{ S.af=v; S.mute=false; }, title:'VOLUM',   help:TIP.af});

/* main dial */
const dial=$('dial'), face=$('dialFace');
HELP.attach(dial, TIP.dial);
let rot=0;
function spin(deg){ rot+=deg; dial.style.background=`repeating-conic-gradient(from ${rot}deg,#232428 0 3deg,#0d0e10 3deg 6deg)`; face.style.transform=`rotate(${rot}deg)`; }
let acc=0, lastA=null;
const ang=e=>{ const r=dial.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI; };
dial.addEventListener('pointerdown',e=>{ dial.setPointerCapture(e.pointerId); lastA=ang(e); });
dial.addEventListener('pointermove',e=>{
  if(lastA===null) return;
  const a=ang(e); let d=a-lastA; if(d>180)d-=360; if(d<-180)d+=360; lastA=a;
  if(S.lock || !S.power) return;
  spin(d); acc+=d;
  const per = 10;
  while(Math.abs(acc)>=per){ tune(Math.sign(acc)); acc-=Math.sign(acc)*per; }
});
dial.addEventListener('pointerup',()=>lastA=null);
dial.addEventListener('wheel',e=>{ e.preventDefault(); if(S.lock||!S.power) return; const s=e.deltaY<0?1:-1; spin(s*10); tune(s); },{passive:false});

/* keyboard */
window.addEventListener('keydown',e=>{
  if(e.target.classList && e.target.classList.contains('knob')) return;
  if(/^[0-9.]$/.test(e.key)) keyIn(e.key);
  else if(e.key==='Enter'){ if(S.entry!==null){ e.preventDefault(); enter(); } }
  else if(e.key==='Escape') clr();
  else if(e.key==='m' || e.key==='M') toggleMute();
  else if(e.key==='Backspace' && S.entry!==null){ S.entry=S.entry.slice(0,-1); update(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); tune(1); spin(10); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); tune(-1); spin(-10); }
});

/* ---------------- fit to screen ---------------- */
const W=1040, HH=450;
function fit(){
  const s=Math.min(1.25,(window.innerWidth-32)/W,(window.innerHeight-32)/HH);
  stage._scale = s;
  stage.style.transform=`scale(${s})`;
  $('fit').style.width=W*s+'px'; $('fit').style.height=HH*s+'px';
  sizeScope();
}
window.addEventListener('resize',fit); fit();

update();
})();
