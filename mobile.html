<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16171a">
<title>LROP Handheld Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141518;
  --body-1:#2c2e33; --body-2:#17181b;
  --btn-1:#3a3c41; --btn-2:#202125; --btn-text:#ececec;
  --amber:#ffa53a; --amber-2:#ff8a1a; --amber-glow:rgba(255,150,40,.55);
  --lcd-on-1:#ffb347; --lcd-on-2:#ff8f1f; --lcd-off:#3b2f22;
  --seg-on:#1c1006; --seg-ghost:rgba(60,25,0,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(ellipse at 50% 20%,#24262a 0%,var(--bg) 70%);
  font-family:"Barlow Condensed",Arial Narrow,sans-serif;color:#ddd;
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;padding:16px;overflow-x:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.radio{position:relative;width:min(100%,380px);height:min(calc(100dvh - 32px),760px);min-height:560px;
  display:flex;flex-direction:column}

/* ---------- top: antenna + knobs ---------- */
.top{position:relative;height:96px;flex:none}
.antenna{position:absolute;left:30px;bottom:-4px;width:30px;height:100%;border-radius:14px 14px 4px 4px;
  background:linear-gradient(90deg,#0d0d0f,#2c2d31 45%,#121315);box-shadow:0 0 0 1px #050506}
.antenna::before{content:"";position:absolute;inset:10px 6px 30px;border-radius:10px;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px)}
.antenna::after{content:"";position:absolute;left:-4px;right:-4px;bottom:0;height:22px;border-radius:4px;
  background:linear-gradient(90deg,#1a1b1e,#3a3b40 50%,#1a1b1e)}
.tknob{position:absolute;bottom:-2px;width:64px;height:46px;border-radius:7px 7px 3px 3px;cursor:ew-resize;touch-action:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,0) 30%,rgba(255,255,255,.12) 50%,rgba(0,0,0,0) 70%,rgba(0,0,0,.65)),
    repeating-linear-gradient(90deg,#2d2f33 0 3px,#121315 3px 6px);
  box-shadow:0 0 0 1px #050506,0 -2px 0 #3a3c41 inset}
.tknob .cap{position:absolute;left:0;right:0;top:-6px;height:10px;border-radius:50%;
  background:radial-gradient(ellipse,#3a3c41,#1a1b1e 70%);box-shadow:0 0 0 1px #050506}
.tknob .dot{position:absolute;top:-4px;width:6px;height:4px;border-radius:2px;background:var(--amber);margin-left:-3px}
.tknob label{position:absolute;left:0;right:0;top:-24px;text-align:center;font:700 12px/1 "Barlow Condensed";letter-spacing:1.5px;color:#cfcfcf}
#sqlKnob{right:112px}
#volKnob{right:28px}
.led{position:absolute;left:84px;bottom:8px;width:9px;height:9px;border-radius:50%;background:#2a1a0a;box-shadow:0 0 0 1px #000}
.led.on{background:var(--amber);box-shadow:0 0 10px var(--amber-2)}
.led.rx{background:#ffd27a;box-shadow:0 0 14px #ffb347}

/* ---------- body ---------- */
.body{position:relative;flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 16px 18px;
  border-radius:22px 22px 34px 34px;
  background:linear-gradient(180deg,var(--body-1),#202125 35%,var(--body-2));
  box-shadow:0 2px 0 #3c3e43 inset,0 -3px 0 #0b0b0c inset,0 24px 40px rgba(0,0,0,.6),0 0 0 2px #0b0b0d}
.body::before,.body::after{content:"";position:absolute;top:60px;bottom:60px;width:6px;border-radius:3px;
  background:repeating-linear-gradient(180deg,#0e0f11 0 4px,#26272b 4px 7px)}
.body::before{left:4px}.body::after{right:4px}
.brand{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.brand .logo{font:italic 700 22px/1 "Barlow Condensed";color:#f2f2f2;letter-spacing:1px}
.brand .logo small{font-size:11px;font-style:normal;color:#999;letter-spacing:2px;margin-left:4px}
.brand .model{font:700 14px/1 "Barlow Condensed";letter-spacing:2px;color:var(--amber);border:1px solid #5a4630;border-radius:3px;padding:2px 7px}
.grille{flex:1;min-height:44px;border-radius:12px;
  background:radial-gradient(circle,#050506 0 2.6px,transparent 3.2px) 0 0/11px 11px,linear-gradient(180deg,#1c1d20,#151619);
  box-shadow:0 0 0 2px #0c0c0e,0 2px 0 2px #2f3135}

/* ---------- LCD ---------- */
.bezel{border-radius:12px;padding:8px;background:linear-gradient(180deg,#0e0f11,#1c1d20);box-shadow:0 0 0 2px #050506,0 2px 0 2px #2f3135}
.lcd{position:relative;border-radius:6px;padding:8px 10px 6px;overflow:hidden;color:var(--seg-on);
  background:var(--lcd-off);box-shadow:0 0 0 2px #0a0a0a inset,0 5px 12px rgba(0,0,0,.55) inset;transition:background .35s,filter .2s;touch-action:pan-y}
.lcd.on{background:radial-gradient(ellipse at 50% 40%,var(--lcd-on-1),var(--lcd-on-2) 85%)}
.lcd > *{transition:opacity .3s}
.lcd:not(.on) > :not(.glass){opacity:0!important}
.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 42%)}
.row{display:flex;align-items:center;gap:6px}
.ind{font:700 11px/1 "Barlow Condensed";letter-spacing:.5px;opacity:.09;transition:opacity .15s}
.ind.on{opacity:1}
.ind.box{padding:1px 3px;border-radius:2px}
.ind.box.on{background:var(--seg-on);color:var(--lcd-on-1)}
.batt{margin-left:auto;display:flex;align-items:center;gap:1px}
.batt i{width:4px;height:8px;background:var(--seg-on)}
.batt b{width:22px;height:10px;border:1.5px solid var(--seg-on);border-radius:2px;display:flex;gap:1px;padding:1px}
.batt b i{flex:1;height:auto}
.batt::after{content:"";width:2px;height:5px;background:var(--seg-on)}
.freq{display:flex;align-items:flex-end;justify-content:center;margin:8px 0 4px;height:60px}
.freq svg{height:60px;width:auto;transform:skewX(-7deg);display:block}
.freq .sub svg{height:28px}
.seg{fill:var(--seg-ghost)} .seg.on{fill:var(--seg-on)}
.blink{animation:blink .9s steps(1) infinite}@keyframes blink{50%{opacity:.15}}
.chrow{display:flex;align-items:center;gap:8px;min-height:30px}
.chrow .tag{font:700 12px/1 "Barlow Condensed"}
.chrow .chn{display:flex}
.chrow .chn svg{height:26px;width:auto;transform:skewX(-7deg)}
.name{font:24px/1 "VT323",monospace;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.smeter{margin-top:6px}
.scale{position:relative;height:11px;font:700 10px/1 "Barlow Condensed"}
.scale span{position:absolute;transform:translateX(-50%)}
.bars{display:flex;gap:2px;align-items:flex-end;height:12px}
.bars i{flex:1;background:var(--seg-ghost)} .bars i.on{background:var(--seg-on)}
.status{font:20px/1 "VT323",monospace;margin-top:5px;letter-spacing:1px;white-space:pre;overflow:hidden;text-overflow:ellipsis}

/* ---------- keypad ---------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{position:relative;border:none;border-radius:12px;height:50px;cursor:pointer;color:var(--btn-text);
  background:linear-gradient(180deg,var(--btn-1),var(--btn-2));
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 -3px 0 rgba(0,0,0,.45) inset,0 3px 5px rgba(0,0,0,.7),0 0 0 1px #0a0a0b;
  font:700 16px/1 "Barlow Condensed";letter-spacing:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.btn small{font-size:10px;color:var(--amber);letter-spacing:1px;font-weight:600}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 0 3px rgba(0,0,0,.8),0 0 0 1px #0a0a0b}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.on{color:var(--amber);text-shadow:0 0 8px var(--amber-glow)}
.btn.on::after{content:"";position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber-2)}
.btn.pwr{color:var(--amber)}
.btn.arrow{font-size:22px}
.foot{display:flex;justify-content:space-between;align-items:center;padding:0 6px;font:600 11px/1 "Barlow Condensed";letter-spacing:2px;color:#8b8d92}
.foot a{color:var(--amber);text-decoration:none;letter-spacing:1px}

@media (max-height:640px){ .top{height:72px} .btn{height:42px} .freq,.freq svg{height:48px} .freq .sub svg{height:22px} }
</style>
</head>
<body>
<div class="radio">
  <div class="top">
    <div class="antenna"></div>
    <div class="led" id="led"></div>
    <div class="tknob" id="sqlKnob" tabindex="0" role="slider" aria-label="Squelch"><div class="cap"></div><div class="dot"></div><label>SQL</label></div>
    <div class="tknob" id="volKnob" tabindex="0" role="slider" aria-label="Volum"><div class="cap"></div><div class="dot"></div><label>VOL</label></div>
  </div>

  <div class="body">
    <div class="brand"><span class="logo" id="logo"></span><span class="model" id="model"></span></div>
    <div class="grille"></div>

    <div class="bezel">
      <div class="lcd" id="lcd">
        <div class="row">
          <span class="ind box" id="i-ch">CH</span>
          <span class="ind box" id="i-vfo">VFO</span>
          <span class="ind on" id="i-am">AM</span>
          <span class="ind box" id="i-scan">SCAN</span>
          <span class="ind" id="i-mon">MON</span>
          <span class="ind" id="i-lock">LOCK</span>
          <span class="ind" id="i-live">LIVE</span>
          <span class="ind box" id="i-rx">RX</span>
          <span class="batt"><b><i></i><i></i><i></i></b></span>
        </div>
        <div class="freq" id="freq"></div>
        <div class="chrow">
          <span class="tag" id="chtag">CH</span><span class="chn" id="chn"></span>
          <span class="name" id="name"></span>
        </div>
        <div class="smeter"><div class="scale" id="scale"></div><div class="bars" id="bars"></div></div>
        <div class="status" id="status"></div>
        <div class="glass"></div>
      </div>
    </div>

    <div class="pad" id="pad"></div>
    <div class="foot"><span>AIRBAND RECEIVER</span><a href="index.html?desktop">DESKTOP ›</a></div>
  </div>
</div>

<audio id="stream" preload="none" playsinline></audio>

<script src="channels.js"></script>
<script>
(() => {
const CFG = window.RADIO_CONFIG;
const CH = [...CFG.channels, {f:CFG.guard, name:'GUARD (no feed)', mount:null}];
const FEEDS = CFG.channels;
const BAND = CFG.band;
const $ = id => document.getElementById(id);
const audio = $('stream'), lcd = $('lcd');
$('logo').innerHTML = `${CFG.brand}<small>${CFG.brandSub}</small>`;
$('model').textContent = CFG.modelHandheld || CFG.model;

const store = {
  get(k,d){ try{ const v=localStorage.getItem('lropm.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('lropm.'+k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  power:false, chMode:true, ch:store.get('ch',0), freq:0, step:25,
  vol:store.get('vol',.6), sql:store.get('sql',.15), light:2,
  mon:false, lock:false, scan:null, feed:null, streamState:'OFF', level:0, flash:null
};
S.ch = Math.min(S.ch, CH.length-1);
S.freq = store.get('freq', CH[S.ch].f);
if(S.chMode) S.freq = CH[S.ch].f;

/* ---------- 7-segment ---------- */
const Hs=(x1,x2,y)=>`${x1},${y} ${x1+5},${y-5} ${x2-5},${y-5} ${x2},${y} ${x2-5},${y+5} ${x1+5},${y+5}`;
const Vs=(x,y1,y2)=>`${x},${y1} ${x+5},${y1+5} ${x+5},${y2-5} ${x},${y2} ${x-5},${y2-5} ${x-5},${y1+5}`;
const SEGS={a:Hs(9,51,6),b:Vs(54,9,48),c:Vs(54,52,91),d:Hs(9,51,94),e:Vs(6,52,91),f:Vs(6,9,48),g:Hs(9,51,50)};
const MAP={'0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':'','o':'cdeg','F':'aefg'};
function digit(ch, dp){
  const on = MAP[ch] ?? '';
  let s=`<svg viewBox="0 0 ${dp?72:60} 100">`;
  for(const k in SEGS) s+=`<polygon class="seg${on.includes(k)?' on':''}" points="${SEGS[k]}"/>`;
  if(dp) s+=`<circle class="seg${dp===2?' on':''}" cx="66" cy="94" r="5"/>`;
  return s+'</svg>';
}
function digits(str, withDp){
  let o='';
  for(let i=0;i<str.length;i++){ if(str[i]==='.') continue; o+=digit(str[i], str[i+1]==='.'?2:(withDp?1:0)); }
  return o;
}
const pad2 = n => String(n).padStart(2,'0');

/* ---------- S-meter ---------- */
const NB=16;
$('scale').innerHTML=[['S1',0],['3',2],['5',4],['7',6],['9',8.5],['+20',11],['+40',13],['+60',15.2]]
  .map(([t,i])=>`<span style="left:${(i+.5)/NB*100}%">${t}</span>`).join('');
$('bars').innerHTML=Array.from({length:NB},(_,i)=>`<i style="height:${i<9?55:100}%"></i>`).join('');
const barEls=[...$('bars').children];

/* ---------- audio ---------- */
let ctx=null, noiseGain=null;
function initNoise(){
  if(ctx) return;
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1600; bp.Q.value=.6;
    noiseGain=ctx.createGain(); noiseGain.gain.value=0;
    src.connect(bp).connect(noiseGain).connect(ctx.destination); src.start();
  }catch(e){ ctx=null; }
}
let token=0, connectT=null;
const onStream = st => () => { if(S.feed && +audio.dataset.token===token){ S.streamState=st; update(); } };
audio.addEventListener('playing', onStream('LIVE'));
audio.addEventListener('waiting', onStream('BUFFER'));
audio.addEventListener('error',   onStream('NO LINK'));
function connect(c){
  token++; audio.dataset.token=token; S.streamState='CONNECT';
  audio.src = CFG.streamBase + c.mount + '?t=' + Date.now();
  audio.muted = true;
  const t=token;
  audio.play().catch(()=>{ if(t===token){ S.streamState='NO LINK'; update(); } });
  setMediaSession(c);
}
function disconnect(){
  clearTimeout(connectT); token++; audio.dataset.token=-1;
  audio.pause(); audio.removeAttribute('src'); audio.load(); S.streamState='OFF';
}
const nearestFeed = () => FEEDS.reduce((b,c)=>Math.abs(c.f-S.freq)<Math.abs(b.f-S.freq)?c:b);
function retune(){
  if(!S.power){ if(S.feed){ S.feed=null; disconnect(); } return; }
  const c = nearestFeed();
  const want = Math.abs(c.f-S.freq)<=6 ? c : null;
  if(want===S.feed) return;
  disconnect(); S.feed=want;
  if(want){ S.streamState='CONNECT'; connectT=setTimeout(()=>connect(want),300); }
}
function signal(){
  if(!S.feed) return 0;
  const df=Math.abs(S.freq-S.feed.f);
  return df<=2 ? 1 : df<=6 ? 1-(df-2)/4*.75 : 0;
}
function levels(){
  const sig=signal(), live=S.streamState==='LIVE';
  let sLvl=.04;
  if(sig>0 && live) sLvl=.45+.4*sig;
  const open = S.mon || S.sql<.03 || sLvl > S.sql*.9;
  const n = 1-(live?sig*.95:0);
  const v = S.vol*S.vol;
  return {sig, live, sLvl, open,
    streamVol:(S.power&&open&&live&&sig>0)? v*sig : 0,
    noiseVol:(S.power&&open)? v*n*.22 : 0};
}
function applyAudio(){
  const L=levels();
  audio.volume=Math.min(1,L.streamVol);
  audio.muted = L.streamVol<=0;            // iOS ignoră volume – folosim mute
  if(noiseGain) noiseGain.gain.setTargetAtTime(L.noiseVol, ctx.currentTime, .03);
  return L;
}
function setMediaSession(c){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({title:c.name, artist:(c.f/1000).toFixed(3)+' MHz', album:'LiveATC · '+CFG.brand});
    navigator.mediaSession.setActionHandler('nexttrack', ()=>step(1));
    navigator.mediaSession.setActionHandler('previoustrack', ()=>step(-1));
  }catch(e){}
}

/* ---------- render ---------- */
function update(){
  retune();
  const L=applyAudio();
  lcd.classList.toggle('on',S.power);
  lcd.style.filter=`brightness(${[.5,.75,1][S.light]})`;
  const led=$('led'); led.classList.toggle('on',S.power); led.classList.toggle('rx',S.power&&L.open&&L.sig>0&&L.live);
  const ind=(id,on)=>$(id).classList.toggle('on',!!on);
  ind('i-ch',S.chMode); ind('i-vfo',!S.chMode); ind('i-scan',S.scan); ind('i-mon',S.mon); ind('i-lock',S.lock);
  ind('i-live',L.live&&S.feed); ind('i-rx',L.open&&L.sig>0&&L.live);

  const mhz=Math.floor(S.freq/1000), khz=S.freq%1000;
  $('freq').innerHTML = digits(String(mhz).padStart(3,' ')+'.'+String(khz).padStart(3,'0'), true);
  $('chtag').textContent = S.chMode ? 'CH' : 'TS';
  $('chn').innerHTML = S.chMode ? digits(pad2(S.ch+1)) : digits(String(S.step).padStart(2,' '));
  const exact = CH.find(c=>Math.abs(c.f-S.freq)<=2);
  $('name').textContent = S.chMode ? CH[S.ch].name : (exact ? exact.name : 'VFO '+S.step+'k');

  let st;
  if(S.flash) st=S.flash;
  else if(S.feed) st = S.streamState==='LIVE' ? 'LIVEATC '+S.feed.mount.toUpperCase() : S.streamState+'...';
  else st = S.mon ? 'MONITOR' : 'NO SIGNAL';
  $('status').textContent=st;
  S.L=L;
}
function flash(t){ S.flash=t; update(); clearTimeout(flash.t); flash.t=setTimeout(()=>{S.flash=null;update();},1200); }

let last=0;
(function tick(ts){
  requestAnimationFrame(tick);
  if(ts-last<70) return; last=ts;
  if(!S.power){ barEls.forEach(b=>b.classList.remove('on')); return; }
  const L=S.L||levels();
  let target=L.sLvl;
  if(L.sig>0&&L.live) target+=(Math.random()-.5)*.14; else target=Math.random()*target*1.3;
  S.level+=(target-S.level)*.5;
  const lit=Math.round(Math.max(0,Math.min(1,S.level))*NB);
  barEls.forEach((b,i)=>b.classList.toggle('on',i<lit));
})(0);

/* ---------- actions ---------- */
function save(){ store.set('ch',S.ch); store.set('freq',S.freq); store.set('vol',S.vol); store.set('sql',S.sql); }
const blocked = () => !S.power || S.lock;
function step(d){
  if(blocked()) return;
  if(S.scan) stopScan();
  if(S.chMode){ S.ch=(S.ch+d+CH.length)%CH.length; S.freq=CH[S.ch].f; }
  else{
    let f=Math.round(S.freq/S.step)*S.step;
    if(f!==S.freq && Math.sign(d)===Math.sign(f-S.freq)) d-=Math.sign(d);
    f+=d*S.step; if(f<BAND[0]) f=BAND[1]; if(f>BAND[1]) f=BAND[0];
    S.freq=f;
  }
  save(); update();
}
function power(){
  S.power=!S.power;
  if(S.power){ initNoise(); if(ctx&&ctx.state==='suspended') ctx.resume(); flash('HELLO'); }
  else { stopScan(); S.mon=false; }
  update(); syncBtns();
}
function scan(){
  if(blocked()) return;
  if(S.scan){ stopScan(); return; }
  if(S.chMode){
    S.scan=setInterval(()=>{ S.ch=(S.ch+1)%CH.length; S.freq=CH[S.ch].f; save(); update(); },6000);
  } else {
    S.scan=setInterval(()=>{
      let f=S.freq+25; if(f>BAND[1]) f=BAND[0]; S.freq=f;
      const c=nearestFeed(); if(Math.abs(c.f-f)<25){ S.freq=c.f; stopScan(); }
      update();
    },45);
  }
  update(); syncBtns();
}
function stopScan(){ if(S.scan){ clearInterval(S.scan); S.scan=null; save(); update(); syncBtns(); } }
function mode(){
  if(blocked()) return;
  stopScan();
  S.chMode=!S.chMode;
  if(S.chMode){ const i=CH.findIndex(c=>Math.abs(c.f-S.freq)<=2); if(i>=0) S.ch=i; S.freq=CH[S.ch].f; }
  save(); update();
}

/* ---------- buttons ---------- */
const DEF=[
  ['PWR','','pwr',power],
  ['MON','SQL OPEN','mon',()=>{ if(!S.power) return; S.mon=!S.mon; update(); syncBtns(); }],
  ['LIGHT','',null,()=>{ S.light=(S.light+2)%3; update(); }],
  ['◀','','arrow',()=>step(-1)],
  ['SCAN','','scan',scan],
  ['▶','','arrow',()=>step(1)],
  ['CH/VFO','MODE',null,mode],
  ['TS','STEP',null,()=>{ if(blocked()) return; S.step=S.step===25?5:S.step===5?1:25; if(!S.chMode) flash('STEP '+S.step+' KHZ'); update(); }],
  ['LOCK','','lock',()=>{ if(!S.power) return; S.lock=!S.lock; flash(S.lock?'KEYS LOCKED':'UNLOCKED'); syncBtns(); }],
];
const pad=$('pad'), btnEls={};
DEF.forEach(([label,sub,key,fn])=>{
  const b=document.createElement('button');
  b.className='btn'+(key==='pwr'?' pwr':'')+(key==='arrow'?' arrow':'');
  b.innerHTML=label+(sub?`<small>${sub}</small>`:'');
  b.setAttribute('aria-label',label==='◀'?'Înapoi':label==='▶'?'Înainte':label);
  pad.appendChild(b);
  if(key && key!=='arrow' && key!=='pwr') btnEls[key]=b;
  if(key==='pwr') btnEls.pwr=b;
  if(key==='arrow'){
    // apăsare lungă = repetare
    let rep=null, delay=null;
    const stop=()=>{ clearTimeout(delay); clearInterval(rep); };
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); fn(); delay=setTimeout(()=>rep=setInterval(fn,90),400); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener('click',e=>{ if(e.detail===0) fn(); });   // tastatură
  } else b.addEventListener('click',fn);
});
function syncBtns(){
  btnEls.pwr.classList.toggle('on',S.power);
  btnEls.mon.classList.toggle('on',S.mon);
  btnEls.scan.classList.toggle('on',!!S.scan);
  btnEls.lock.classList.toggle('on',S.lock);
}

/* ---------- top knobs ---------- */
function knob(el, get, set, label){
  const dot=el.querySelector('.dot');
  const draw=()=>{
    const v=get();
    el.style.backgroundPosition=`0 0, ${Math.round(v*60)}px 0`;
    dot.style.left = (8 + v*48)+'px';
    el.setAttribute('aria-valuenow', Math.round(v*100));
  };
  const setV=v=>{ set(Math.max(0,Math.min(1,v))); draw(); save(); if(S.power) flash(label+' '+pad2(Math.round(get()*20))); else update(); };
  let x0=null,y0=null,v0=0;
  el.addEventListener('pointerdown',e=>{ el.setPointerCapture(e.pointerId); x0=e.clientX; y0=e.clientY; v0=get(); });
  el.addEventListener('pointermove',e=>{ if(x0===null) return; setV(v0+((e.clientX-x0)+(y0-e.clientY))/160); });
  el.addEventListener('pointerup',()=>x0=null); el.addEventListener('pointercancel',()=>x0=null);
  el.addEventListener('wheel',e=>{ e.preventDefault(); setV(get()-Math.sign(e.deltaY)*.05); },{passive:false});
  el.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'||e.key==='ArrowRight') setV(get()+.05);
    else if(e.key==='ArrowDown'||e.key==='ArrowLeft') setV(get()-.05); else return;
    e.preventDefault();
  });
  draw();
}
knob($('volKnob'),()=>S.vol,v=>S.vol=v,'VOL');
knob($('sqlKnob'),()=>S.sql,v=>S.sql=v,'SQL');

/* ---------- swipe pe display ---------- */
let sx=null, sy=null;
lcd.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; });
lcd.addEventListener('pointerup',e=>{
  if(sx===null) return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) step(dx<0?1:-1);
});

/* tastatură (pentru test pe desktop) */
window.addEventListener('keydown',e=>{
  if(e.target.classList.contains('tknob')) return;
  if(e.key==='ArrowRight'){ step(1); } else if(e.key==='ArrowLeft'){ step(-1); }
});

update(); syncBtns();
})();
</script>
